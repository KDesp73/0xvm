<!doctype html>
<!-- SPDX-License-Identifier: MIT -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>0xvm // browser host</title>
  <style>
    :root {
      color-scheme: dark;
      /* 0xvm house palette: 0 canvas, 1 ink, 2 structure, 3 pale-green accent. */
      --p0: #060907;
      --p1: #F2F6F0;
      --p2: #2A352C;
      --p3: #B9E5AD;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--p0);
      color: var(--p1);
      font: 12px/16px var(--mono);
    }

    .shell {
      max-width: 960px;
      margin: 0 auto;
      padding: 16px;
    }

    .header-strip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 16px;
      padding: 0 8px;
      margin-bottom: 16px;
      background: var(--p1);
      color: var(--p0);
    }

    .header-strip span:last-child { opacity: .72; }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 256px;
      gap: 24px;
      align-items: start;
    }

    canvas {
      display: block;
      width: 640px;
      max-width: 100%;
      height: auto;
      background: var(--p0);
      image-rendering: pixelated;
      border: 1px solid var(--p2);
      outline: none;
    }

    canvas:focus-visible { outline: 1px solid var(--p3); outline-offset: 1px; }

    .caption, .keys {
      max-width: 640px;
      margin: 8px 0 0;
      color: var(--p1);
      font-size: 11px;
    }

    .keys { margin-top: 16px; }
    .keys b { font-weight: 400; color: var(--p3); }

    .side { min-width: 0; }
    .row { display: flex; gap: 8px; margin-bottom: 16px; }
    .block { margin-bottom: 24px; }

    button, input { font: inherit; }

    button {
      padding: 4px 8px;
      color: var(--p1);
      background: var(--p2);
      border: 1px solid var(--p2);
      border-radius: 0;
      cursor: pointer;
    }

    button:hover:not(:disabled) { border-color: var(--p3); }
    button:focus-visible:not(:disabled) { outline: 1px solid var(--p3); outline-offset: 1px; }
    button:disabled { opacity: .5; cursor: default; }

    button.primary {
      color: var(--p0);
      background: var(--p3);
      border-color: var(--p3);
    }

    label, .block-title {
      display: block;
      margin-bottom: 4px;
      color: var(--p1);
      font-size: 11px;
    }

    #rom {
      display: block;
      width: 100%;
      padding: 3px 4px;
      color: var(--p1);
      background: var(--p0);
      border: 1px solid var(--p2);
    }

    .roms {
      margin: 8px 0 0;
      color: var(--p1);
      font-size: 11px;
    }

    .rom-link {
      padding: 0;
      color: var(--p3);
      background: none;
      border: 0;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .rom-link:hover:not(:disabled) { color: var(--p1); background: none; }
    .rom-link[data-active="true"] { color: var(--p1); font-weight: 700; }

    .tty {
      height: 176px;
      overflow: auto;
      margin: 0 0 8px;
      padding: 8px;
      color: var(--p1);
      background: var(--p0);
      border: 1px solid var(--p2);
      white-space: pre-wrap;
    }

    form { display: flex; gap: 8px; }

    form input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 4px 8px;
      color: var(--p1);
      background: var(--p0);
      border: 1px solid var(--p2);
    }

    form input::placeholder { color: var(--p2); }

    #status { margin-top: 16px; color: var(--p1); font-size: 11px; }
    #status::before { content: "■ "; color: var(--p3); }
    #status[data-state="error"] { color: var(--p3); }

    @media (max-width: 800px) {
      .layout { grid-template-columns: 1fr; }
      .side { padding-top: 16px; border-top: 1px solid var(--p2); }
      .tty { height: 144px; }
      .header-strip span:last-child { display: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="header-strip">
      <span>0xvm</span>
      <span>vmim v2 · 64k · device page</span>
    </header>

    <main class="layout">
      <section>
        <canvas id="screen" width="320" height="240" tabindex="0"></canvas>
        <p class="caption">screen <span id="screen-size">320 × 240</span> · pixel buffer</p>
        <p class="keys">
          <b>↑</b> <b>↓</b> <b>←</b> <b>→</b> move ·
          <b>space</b> <b>enter</b> act ·
          <b>esc</b> quit
        </p>
      </section>

      <aside class="side">
        <div class="row">
          <button id="run" class="primary" disabled>Pause</button>
          <button id="reset" disabled>Restart</button>
        </div>

        <div class="block">
          <label for="rom">rom file</label>
          <input id="rom" type="file" accept=".rom,.bin">
          <p class="roms">
            load:
            <button type="button" class="rom-link" data-rom="snake.rom">snake</button> ·
            <button type="button" class="rom-link" data-rom="typography.rom">type</button> ·
            <button type="button" class="rom-link" data-rom="lua-raycaster.rom">raycaster</button> ·
            <button type="button" class="rom-link" data-rom="lua-typography.rom">lua type</button>
          </p>
        </div>

        <div class="block">
          <span class="block-title">console</span>
          <pre id="console" class="tty" aria-label="Console output"></pre>
          <form id="input-form">
            <input id="console-input" type="text" placeholder="input" autocomplete="off" spellcheck="false">
            <button type="submit">Send</button>
          </form>
        </div>

        <div id="status" data-state="loading" aria-live="polite">loading…</div>
      </aside>
    </main>
  </div>

  <!-- Bump the query when the host scripts change so browsers do not keep an
       old key map (e.g. one without Backspace/Delete) after a rebuild. -->
  <script src="0xvm-wasm.js?v=3"></script>
  <script src="0xvm-app.js?v=3"></script>
</body>
</html>
